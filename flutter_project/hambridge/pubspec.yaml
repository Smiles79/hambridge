name: HamBridge
description: QSO Recorder
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_classic: 0.0.9
  file_picker: ^8.0.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  path: ^1.9.0
  intl: ^0.19.0
  provider: ^6.1.2
  geolocator: ^14.0.2
  flutter_foreground_task: ^9.2.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D0F14"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
